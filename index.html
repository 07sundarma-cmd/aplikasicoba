<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Video Saya</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0f0f0f; color: #f1f1f1; padding-bottom: 20px; 
        }
        header { 
            padding: 15px 20px; border-bottom: 1px solid #272727; 
            margin-bottom: 20px; background-color: #0f0f0f;
            position: sticky; top: 0; z-index: 10;
        }
        h1 { font-size: 20px; }
        .video-grid { 
            display: grid; grid-template-columns: 1fr; gap: 25px 15px; padding: 0 15px; 
        }
        @media (min-width: 600px) { .video-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .video-grid { grid-template-columns: repeat(3, 1fr); } }
        .video-card { display: flex; flex-direction: column; gap: 10px; }
        video { 
            width: 100%; aspect-ratio: 16/9; border-radius: 12px; 
            object-fit: cover; background-color: #000; outline: none; 
        }
        .video-info { padding: 0 5px; }
        .video-title { 
            font-size: 16px; font-weight: 500; line-height: 1.4; 
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; 
        }
    </style>
</head>
<body>

    <header>
        <h1>Aplikasi Streaming Saya</h1>
    </header>

    <div class="video-grid">
        <div class="video-card">
            <!-- Link Thumbnail ImgBB Anda -->
            <video controls controlsList="nodownload" poster="https://i.ibb.co.com/ynrFrqkm/Screenshot-15-Copy.png">
                <!-- Link Dropbox Anda (spasi sudah dibersihkan) -->
                <source src="https://www.dropbox.com/scl/fi/t2ixbe3yih1vof5q68x2w/document_5105347669644018577.mp4?rlkey=nod9gewdxtuag2dqnc8jkztwc&st=pygrf5c0&raw=1" type="video/mp4">
            </video>
            <div class="video-info">
                <div class="video-title">Bermain dengan ayah part 1</div>
            </div>
        </div>
    </div>

</body>
</html>
