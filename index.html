<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Beranda</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #0f0f0f; color: #f1f1f1; min-height: 100vh; }
        header { position: sticky; top: 0; z-index: 100; background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        .logo { font-size: 20px; font-weight: 700; color: #ff0000; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .logo span { color: #ffffff; }
        #home-page { padding: 24px; }
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #fff; }
        .video-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 550px) { .video-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .video-grid { grid-template-columns: repeat(3, 1fr); } }
        .video-card { background: transparent; cursor: pointer; display: flex; flex-direction: column; gap: 12px; transition: transform 0.2s ease; }
        .video-card:hover { transform: translateY(-4px); }
        .thumbnail-container { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background-color: #272727; }
        .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .video-card:hover .thumbnail-container img { transform: scale(1.05); }
        .video-meta h3 { font-size: 15px; font-weight: 500; line-height: 1.4; color: #f1f1f1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .video-meta p { font-size: 13px; color: #aaa; margin-top: 4px; }
        #watch-page { display: none; padding: 24px; max-width: 1200px; margin: 0 auto; }
        .back-btn { background: #272727; color: #fff; border: none; padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .player-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .player-container video { width: 100%; height: 100%; object-fit: contain; outline: none; }
        .watch-title { font-size: 20px; font-weight: 600; margin-top: 16px; color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="goHome()">
            <i class="fa-solid fa-play"></i> Stream<span>Flix</span>
        </div>
    </header>

    <!-- HALAMAN BERANDA -->
    <div id="home-page">
        <div class="section-title">Video Pilihan Untuk Anda</div>
        <div class="video-grid" id="video-container">
            
            <!-- KARTU VIDEO 1 (Otomatis muncul di beranda) -->
            <div class="video-card" onclick="playVideo('https://www.dropbox.com/scl/fi/t2ixbe3yih1vof5q68x2w/document_5105347669644018577.mp4?rlkey=nod9gewdxtuag2dqnc8jkztwc&st=pygrf5c0&raw=1', 'Bermain dengan ayah part 1')">
                <div class="thumbnail-container">
                    <img src="https://picsum.photos/640/360" alt="Thumbnail">
                </div>
                <div class="video-details">
                    <div class="video-meta">
                        <h3>Bermain dengan ayah part 1</h3>
                        <p>Video • Baru</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- HALAMAN PEMUTAR VIDEO -->
    <div id="watch-page">
        <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
        <div class="player-container">
            <video id="main-video" controls autoplay controlsList="nodownload"></video>
        </div>
        <div class="watch-title" id="watch-title-text">Judul Video</div>
    </div>

    <script>
        function playVideo(videoUrl, videoTitle) {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('watch-page').style.display = 'block';

            document.getElementById('watch-title-text').innerText = videoTitle;
            const videoPlayer = document.getElementById('main-video');
            videoPlayer.src = videoUrl;
            videoPlayer.play();

            window.scrollTo(0, 0);
        }

        function goHome() {
            const videoPlayer = document.getElementById('main-video');
            videoPlayer.pause();
            videoPlayer.src = "";

            document.getElementById('watch-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
