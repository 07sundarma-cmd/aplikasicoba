<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Video Saya</title>
    <!-- Memanggil library pembantu untuk membaca data Google Sheets (PapaParse) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        /* Pengaturan Dasar & Mode Gelap ala YouTube */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0f0f0f; 
            color: #f1f1f1; 
            padding-bottom: 20px; 
        }
        
        /* Header / Navigasi Atas */
        header { 
            padding: 15px 20px; 
            border-bottom: 1px solid #272727; 
            margin-bottom: 20px; 
            background-color: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        h1 { font-size: 20px; }

        /* Grid Layout untuk Video */
        .video-grid { 
            display: grid; 
            grid-template-columns: 1fr; /* 1 Kolom untuk HP */
            gap: 25px 15px; 
            padding: 0 15px; 
        }
        
        /* Jika layar lebar (Tablet/Laptop), ubah jadi 2 atau 3 kolom */
        @media (min-width: 600px) { .video-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .video-grid { grid-template-columns: repeat(3, 1fr); } }

        /* Desain Kartu Video */
        .video-card { display: flex; flex-direction: column; gap: 10px; }
        
        /* Pemutar Video & Thumbnail */
        video { 
            width: 100%; 
            aspect-ratio: 16/9; /* Proporsi standar YouTube */
            border-radius: 12px; /* Sudut melengkung */
            object-fit: cover; 
            background-color: #000; 
            outline: none; 
        }
        
        /* Judul Video */
        .video-info { padding: 0 5px; }
        .video-title { 
            font-size: 16px; 
            font-weight: 500; 
            line-height: 1.4; 
            /* Memotong teks panjang menjadi maksimal 2 baris */
            display: -webkit-box; 
            -webkit-line-clamp: 2; 
            -webkit-box-orient: vertical; 
            overflow: hidden; 
        }

        /* Tulisan loading saat mengambil data */
        #loading { text-align: center; padding: 20px; color: #aaa; }
    </style>
</head>
<body>

    <header>
        <h1>Nama Aplikasi Anda</h1>
    </header>

    <!-- Tulisan ini akan muncul sesaat lalu hilang setelah video berhasil dimuat -->
    <div id="loading">Memuat video dari database...</div>

    <!-- Tempat kosong di mana video dari Google Sheets akan dimunculkan otomatis -->
    <div class="video-grid" id="video-container"></div>

    <script>
        // INI ADALAH LINK CSV GOOGLE SHEETS ANDA
        const googleSheetCSVLink = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ7Bza1_hDVQpEiPtq5eJGNuOyJ1eldjXJVQXbJHBRLuku6HAsn22bz2J5shmbrH8QWmvj3L31R94WE/pub?output=csv";

        // Fungsi untuk mengambil data dan menampilkannya
        Papa.parse(googleSheetCSVLink, {
            download: true,
            header: true, // Beritahu program bahwa baris pertama adalah judul kolom (Judul, Thumbnail, Video)
            complete: function(results) {
                const data = results.data;
                const container = document.getElementById('video-container');
                const loading = document.getElementById('loading');
                
                // Hilangkan teks loading
                loading.style.display = 'none';

                // Lakukan perulangan untuk setiap baris di Google Sheets
                data.forEach(row => {
                    // Pastikan baris tersebut memiliki judul dan video (tidak kosong)
                    if(row.Judul && row.Video) {
                        
                        // Buat kotak video baru
                        const cardHTML = `
                            <div class="video-card">
                                <video controls controlsList="nodownload" poster="${row.Thumbnail}">
                                    <source src="${row.Video}" type="video/mp4">
                                </video>
                                <div class="video-info">
                                    <div class="video-title">${row.Judul}</div>
                                </div>
                            </div>
                        `;
                        // Masukkan ke dalam layar aplikasi
                        container.innerHTML += cardHTML;
                    }
                });
            },
            error: function() {
                document.getElementById('loading').innerText = "Gagal memuat data. Periksa koneksi internet atau link Google Sheets.";
            }
        });
    </script>
</body>
</html>
